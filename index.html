<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manas Omer | Links</title>

    <meta
        name="description"
        content="Manas Omer — tech, projects, ideas and more."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- ==============================
             PROFILE
        =============================== -->
        <section class="profile">

            <div class="avatar">
                M
            </div>

            <h1>
                Manas Omer
            </h1>

            <p class="tagline">
                Building things I wish existed.
            </p>

            <div class="social-mini">

                <a
                    href="https://github.com/manasomer0902"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-track="github"
                >
                    GitHub
                </a>

                <span>•</span>

                <a
                    href="https://www.instagram.com/manasomer09/"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-track="instagram"
                >
                    Instagram
                </a>

            </div>

        </section>


        <!-- ==============================
             FEATURED PROJECT
        =============================== -->
        <section class="featured">

            <div class="section-label">
                <span>FEATURED PROJECT</span>
            </div>

            <div class="project-card">

                <div class="project-icon">
                    V
                </div>

                <div class="project-info">

                    <h2>
                        VeyroDock
                    </h2>

                    <p>
                        A lightweight Spotify desktop widget for Windows.
                    </p>

                    <a
                        class="project-button"
                        href="https://github.com/manasomer0902/VeyroDock"
                        target="_blank"
                        rel="noopener noreferrer"
                        data-track="veyrodock"
                    >
                        View Project →
                    </a>

                </div>

            </div>

        </section>


        <!-- ==============================
             LINKS
        =============================== -->
        <section class="links">

            <div class="section-label">
                <span>FIND ME</span>
            </div>


            <!-- GitHub -->
            <a
                class="link-card"
                href="https://github.com/manasomer0902"
                target="_blank"
                rel="noopener noreferrer"
                data-track="github"
            >

                <span class="link-icon">
                    GH
                </span>

                <span class="link-name">
                    GitHub
                </span>

                <span class="arrow">
                    ↗
                </span>

            </a>


            <!-- LinkedIn -->
            <a
                class="link-card"
                href="https://www.linkedin.com/in/manas-omer-6066b5287/"
                target="_blank"
                rel="noopener noreferrer"
                data-track="linkedin"
            >

                <span class="link-icon">
                    in
                </span>

                <span class="link-name">
                    LinkedIn
                </span>

                <span class="arrow">
                    ↗
                </span>

            </a>


            <!-- Portfolio -->
            <a
                class="link-card"
                href="https://manasomer0902.github.io/Portfolio/"
                target="_blank"
                rel="noopener noreferrer"
                data-track="portfolio"
            >

                <span class="link-icon">
                    ◎
                </span>

                <span class="link-name">
                    My Portfolio
                </span>

                <span class="arrow">
                    ↗
                </span>

            </a>


            <!-- Instagram -->
            <a
                class="link-card"
                href="https://www.instagram.com/manasomer09/"
                target="_blank"
                rel="noopener noreferrer"
                data-track="instagram"
            >

                <span class="link-icon">
                    IG
                </span>

                <span class="link-name">
                    Instagram
                </span>

                <span class="arrow">
                    ↗
                </span>

            </a>

        </section>


        <!-- ==============================
             FOOTER
        =============================== -->
        <footer>

            <span>
                © 2026 Manas Omer
            </span>

            <span>
                Built with curiosity.
            </span>

        </footer>

    <!-- ==============================
         JAVASCRIPT
    =============================== -->
    <script src="script.js"></script>
