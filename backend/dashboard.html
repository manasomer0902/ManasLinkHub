<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manas Analytics</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #08090c;
            --card: rgba(255, 255, 255, 0.055);
            --card-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.10);
            --text: #f5f5f7;
            --muted: #9698a2;
            --accent: #8b7cff;
            --green: #69d39c;
            --red: #ff6b7a;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(139, 124, 255, 0.18),
                    transparent 38%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }


        /* ==============================
           CONTAINER
        =============================== */

        .container {
            width: min(100% - 32px, 900px);

            margin: 0 auto;

            padding: 55px 0 40px;
        }


        /* ==============================
           HEADER
        =============================== */

        .header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 35px;
        }

        .header-left h1 {
            font-size: clamp(26px, 5vw, 36px);

            letter-spacing: -1.5px;
        }

        .header-left p {
            margin-top: 7px;

            color: var(--muted);

            font-size: 13px;
        }


        .header-right {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        /* ==============================
           STATUS
        =============================== */

        .status {
            display: flex;

            align-items: center;

            gap: 7px;

            padding: 8px 12px;

            border:
                1px solid var(--border);

            border-radius: 20px;

            background: var(--card);

            color: var(--muted);

            font-size: 11px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 10px
                rgba(105, 211, 156, 0.7);
        }


        /* ==============================
           LOGOUT BUTTON
        =============================== */

        .logout-button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 8px 13px;

            border:
                1px solid
                rgba(255, 107, 122, 0.20);

            border-radius: 20px;

            background:
                rgba(255, 107, 122, 0.06);

            color: #ff9ba5;

            font-size: 11px;

            text-decoration: none;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .logout-button:hover {
            background:
                rgba(255, 107, 122, 0.12);

            border-color:
                rgba(255, 107, 122, 0.35);

            transform: translateY(-1px);
        }


        /* ==============================
           STAT CARDS
        =============================== */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 14px;

            margin-bottom: 35px;
        }

        .stat-card {
            padding: 22px;

            border:
                1px solid var(--border);

            border-radius: 18px;

            background: var(--card);

            backdrop-filter: blur(15px);
        }

        .stat-label {
            color: var(--muted);

            font-size: 11px;

            letter-spacing: 1px;

            text-transform: uppercase;
        }

        .stat-value {
            margin-top: 9px;

            font-size: 30px;

            font-weight: 700;

            letter-spacing: -1px;
        }


        /* ==============================
           SECTION
        =============================== */

        .section {
            margin-top: 30px;
        }

        .section-title {
            margin-bottom: 13px;

            color: #6f717b;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 1.8px;

            text-transform: uppercase;
        }


        /* ==============================
           LINK PERFORMANCE
        =============================== */

        .link-list {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .link-row {
            padding: 18px;

            border:
                1px solid var(--border);

            border-radius: 16px;

            background: var(--card);
        }

        .link-top {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 11px;
        }

        .link-name {
            font-size: 14px;

            font-weight: 600;
        }

        .link-count {
            color: var(--text);

            font-size: 13px;

            font-weight: 700;
        }

        .bar {
            width: 100%;

            height: 7px;

            overflow: hidden;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.06);
        }

        .bar-fill {
            height: 100%;

            width: 0%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    var(--accent),
                    #b4aaff
                );

            transition:
                width 0.5s ease;
        }


        /* ==============================
           ACTIVITY
        =============================== */

        .activity-list {
            display: flex;

            flex-direction: column;

            border:
                1px solid var(--border);

            border-radius: 16px;

            background: var(--card);

            overflow: hidden;
        }

        .activity {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 16px 18px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.06);
        }

        .activity:last-child {
            border-bottom: none;
        }

        .activity-left {
            min-width: 0;
        }

        .activity-name {
            font-size: 13px;

            font-weight: 600;
        }

        .activity-meta {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 5px;

            color: var(--muted);

            font-size: 10px;
        }

        .activity-badge {
            display: inline-block;

            padding: 3px 7px;

            border:
                1px solid
                rgba(139, 124, 255, 0.2);

            border-radius: 6px;

            color: #b8afff;

            background:
                rgba(139, 124, 255, 0.08);
        }

        .activity-time {
            color: var(--muted);

            font-size: 10px;

            white-space: nowrap;
        }


        /* ==============================
           ACTIONS
        =============================== */

        .actions {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-top: 30px;
        }

        .last-updated {
            color: var(--muted);

            font-size: 10px;
        }

        .refresh-button {
            border:
                1px solid var(--border);

            border-radius: 12px;

            padding: 10px 16px;

            background: var(--card);

            color: var(--text);

            font-size: 12px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .refresh-button:hover {
            background: var(--card-hover);

            transform: translateY(-1px);
        }


        /* ==============================
           EMPTY / ERROR
        =============================== */

        .empty {
            padding: 25px;

            color: var(--muted);

            text-align: center;

            font-size: 13px;
        }

        .error {
            color: var(--red);
        }


        /* ==============================
           FOOTER
        =============================== */

        footer {
            margin-top: 45px;

            padding-top: 20px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.06);

            color: #5f616a;

            text-align: center;

            font-size: 10px;
        }


        /* ==============================
           MOBILE
        =============================== */

        @media (max-width: 650px) {

            .container {
                width:
                    min(
                        100% - 24px,
                        900px
                    );

                padding-top: 35px;
            }

            .header {
                align-items: flex-start;

                flex-direction: column;
            }

            .header-right {
                width: 100%;

                justify-content: space-between;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .stat-value {
                font-size: 27px;
            }

            .activity {
                align-items: flex-start;

                flex-direction: column;

                gap: 8px;
            }

            .actions {
                align-items: flex-start;

                flex-direction: column;
            }

        }

    </style>

</head>


<body>

    <main class="container">


        <!-- ==============================
             HEADER
        =============================== -->

        <header class="header">

            <div class="header-left">

                <h1>
                    Manas Analytics
                </h1>

                <p>
                    Private Link Hub Dashboard
                </p>

            </div>


            <div class="header-right">

                <div class="status">

                    <span class="status-dot"></span>

                    Analytics Online

                </div>


                <a
                    class="logout-button"
                    href="/admin/logout"
                >
                    Logout
                </a>

            </div>

        </header>


        <!-- ==============================
             STATS
        =============================== -->

        <section class="stats">


            <div class="stat-card">

                <div class="stat-label">
                    Total Events
                </div>

                <div
                    class="stat-value"
                    id="totalEvents"
                >
                    —
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Total Clicks
                </div>

                <div
                    class="stat-value"
                    id="totalClicks"
                >
                    —
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Links Tracked
                </div>

                <div
                    class="stat-value"
                    id="linksTracked"
                >
                    —
                </div>

            </div>


        </section>


        <!-- ==============================
             LINK PERFORMANCE
        =============================== -->

        <section class="section">

            <div class="section-title">
                Link Performance
            </div>


            <div
                class="link-list"
                id="linkList"
            >

                <div class="empty">
                    Loading analytics...
                </div>

            </div>

        </section>


        <!-- ==============================
             RECENT ACTIVITY
        =============================== -->

        <section class="section">

            <div class="section-title">
                Recent Activity
            </div>


            <div
                class="activity-list"
                id="activityList"
            >

                <div class="empty">
                    Loading activity...
                </div>

            </div>

        </section>


        <!-- ==============================
             ACTIONS
        =============================== -->

        <div class="actions">

            <div
                class="last-updated"
                id="lastUpdated"
            >
                Last updated: —
            </div>


            <button
                class="refresh-button"
                id="refreshButton"
            >
                Refresh Analytics
            </button>

        </div>


        <!-- ==============================
             FOOTER
        =============================== -->

        <footer>

            Private dashboard · Manas Omer

        </footer>


    </main>


    <script>

        // ========================================
        // CONFIGURATION
        // ========================================

        const API_URL =
            window.location.origin;


        // ========================================
        // LOAD SUMMARY
        // ========================================

        async function loadSummary() {

            const response =
                await fetch(
                    `${API_URL}/api/analytics`
                );


            if (response.status === 401) {

                window.location.href =
                    "/admin/login";

                return null;

            }


            if (!response.ok) {

                throw new Error(
                    "Analytics API failed"
                );

            }


            return await response.json();

        }


        // ========================================
        // LOAD RECENT ACTIVITY
        // ========================================

        async function loadRecentActivity() {

            const response =
                await fetch(
                    `${API_URL}/api/recent`
                );


            if (response.status === 401) {

                window.location.href =
                    "/admin/login";

                return null;

            }


            if (!response.ok) {

                throw new Error(
                    "Recent activity API failed"
                );

            }


            return await response.json();

        }


        // ========================================
        // LOAD EVERYTHING
        // ========================================

        async function loadDashboard() {

            try {

                const [
                    summary,
                    recent
                ] = await Promise.all([

                    loadSummary(),

                    loadRecentActivity()

                ]);


                if (!summary || !recent) {

                    return;

                }


                updateSummary(
                    summary
                );


                renderLinks(
                    summary.link_clicks
                );


                renderRecentActivity(
                    recent.events
                );


                updateLastUpdated();


            } catch (error) {

                console.error(
                    "Dashboard error:",
                    error
                );


                showError();

            }

        }


        // ========================================
        // UPDATE SUMMARY
        // ========================================

        function updateSummary(
            data
        ) {

            document.getElementById(
                "totalEvents"
            ).textContent =
                data.total_events;


            document.getElementById(
                "totalClicks"
            ).textContent =
                data.total_clicks;


            document.getElementById(
                "linksTracked"
            ).textContent =
                data.link_clicks.length;

        }


        // ========================================
        // RENDER LINK PERFORMANCE
        // ========================================

        function renderLinks(
            links
        ) {

            const container =
                document.getElementById(
                    "linkList"
                );


            if (!links.length) {

                container.innerHTML = `

                    <div class="empty">
                        No clicks recorded yet.
                    </div>

                `;

                return;

            }


            const highest =
                Math.max(
                    ...links.map(
                        item =>
                            item.clicks
                    )
                );


            container.innerHTML =
                links.map(
                    item => {

                        const percentage =
                            highest > 0
                                ? (
                                    item.clicks /
                                    highest
                                ) * 100
                                : 0;


                        return `

                            <div class="link-row">

                                <div class="link-top">

                                    <span
                                        class="link-name"
                                    >
                                        ${formatLinkName(
                                            item.link_name
                                        )}
                                    </span>


                                    <span
                                        class="link-count"
                                    >
                                        ${item.clicks}
                                        ${
                                            item.clicks === 1
                                                ? "click"
                                                : "clicks"
                                        }
                                    </span>

                                </div>


                                <div class="bar">

                                    <div
                                        class="bar-fill"
                                        style="
                                            width:
                                            ${percentage}%;
                                        "
                                    ></div>

                                </div>

                            </div>

                        `;

                    }
                ).join("");

        }


        // ========================================
        // RENDER RECENT ACTIVITY
        // ========================================

        function renderRecentActivity(
            events
        ) {

            const container =
                document.getElementById(
                    "activityList"
                );


            if (!events.length) {

                container.innerHTML = `

                    <div class="empty">
                        No activity recorded yet.
                    </div>

                `;

                return;

            }


            container.innerHTML =
                events.map(
                    event => {

                        const date =
                            formatDate(
                                event.timestamp
                            );


                        const referrer =
                            event.referrer
                                ? formatReferrer(
                                    event.referrer
                                )
                                : "Direct";


                        return `

                            <div class="activity">

                                <div class="activity-left">

                                    <div
                                        class="activity-name"
                                    >
                                        ${formatLinkName(
                                            event.link_name
                                        )}
                                    </div>


                                    <div
                                        class="activity-meta"
                                    >

                                        <span
                                            class="activity-badge"
                                        >
                                            ${event.event_type}
                                        </span>


                                        <span>
                                            ${referrer}
                                        </span>

                                    </div>

                                </div>


                                <div
                                    class="activity-time"
                                >
                                    ${date}
                                </div>

                            </div>

                        `;

                    }
                ).join("");

        }


        // ========================================
        // FORMAT LINK NAME
        // ========================================

        function formatLinkName(
            name
        ) {

            if (!name) {

                return "Unknown";

            }


            return name
                .charAt(0)
                .toUpperCase()
                + name.slice(1);

        }


        // ========================================
        // FORMAT REFERRER
        // ========================================

        function formatReferrer(
            referrer
        ) {

            try {

                const url =
                    new URL(referrer);


                return url.hostname;

            } catch {

                return referrer;

            }

        }


        // ========================================
        // FORMAT DATE
        // ========================================

        function formatDate(
            timestamp
        ) {

            if (!timestamp) {

                return "Unknown";

            }


            const date =
                new Date(timestamp);


            return date.toLocaleString(
                undefined,
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );

        }


        // ========================================
        // LAST UPDATED
        // ========================================

        function updateLastUpdated() {

            const now =
                new Date();


            document.getElementById(
                "lastUpdated"
            ).textContent =
                `Last updated: ${
                    now.toLocaleTimeString()
                }`;

        }


        // ========================================
        // ERROR STATE
        // ========================================

        function showError() {

            document.getElementById(
                "linkList"
            ).innerHTML = `

                <div class="empty error">

                    Unable to connect to
                    analytics server.

                    <br><br>

                    Make sure Flask is running.

                </div>

            `;


            document.getElementById(
                "activityList"
            ).innerHTML = `

                <div class="empty error">

                    Unable to load recent activity.

                </div>

            `;

        }


        // ========================================
        // REFRESH BUTTON
        // ========================================

        document.getElementById(
            "refreshButton"
        ).addEventListener(
            "click",
            loadDashboard
        );


        // ========================================
        // INITIAL LOAD
        // ========================================

        loadDashboard();
        // ========================================

        // AUTO REFRESH
        // ========================================

        setInterval(() => {
            loadDashboard();
        }, 5000);
    </script>

</body>

</html>
